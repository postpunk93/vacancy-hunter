<html><body><template id="HH-Lux-InitialState">{&quot;vacancyView&quot;: {&quot;vacancyFull&quot;: {&quot;vacancy&quot;: {&quot;vacancyId&quot;: 137253869, &quot;name&quot;: &quot;Senior backend разработчик (Rust/C++) с уклоном в embedded разработку&quot;, &quot;description&quot;: &quot;&lt;p&gt;&lt;strong&gt;Мы создаём интеллектуальную платформу видеомониторинга и видеоаналитики с элементами ML на edge-устройствах.&lt;/strong&gt; Система высоконагруженная: тысячи устройств, более 1000 RPS, десятки терабайт данных в сутки. Бэкенд команда разрабатывает сервисы на стыке IoT, облачных вычислений и компьютерного зрения, обеспечивая надёжную обработку потокового видео и метаданных.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Основной язык разработки – Rust.&lt;/strong&gt; Часть legacy и вспомогательных сервисов написана на Python, но мы целенаправленно переводим критические компоненты на Rust.&lt;/p&gt; &lt;p&gt;В настоящее время нашей успешной команде требуется профессионал на должность &lt;strong&gt;Middle+/Senior Embedded разработчик (Rust) или Middle+/Senior Embedded разработчик (C++), с готовностью изучать Rust.&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Мы предлагаем:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;работу в архитектурной команде над сложными высоконагруженными системами;&lt;/li&gt; &lt;li&gt;возможность влиять на техническую стратегию продукта и развитие стека;&lt;/li&gt; &lt;li&gt;участие в профильных конференциях и митапах за счёт компании;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;официальное трудоустройство&lt;/strong&gt; в аккредитованной ИТ компании (в соответствии с ТК РФ);&lt;/li&gt; &lt;li&gt;&lt;strong&gt;график работы 5/2 (3 дня офис, 2 дня дистанционно), &lt;/strong&gt;в пятницу сокращенный рабочий день;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;удобное расположение:&lt;/strong&gt; офис в центре города в шаговой доступности от метро с комфортными рабочими местами;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;финансовая мотивация:&lt;/strong&gt; квартальные и годовые премии, а также вознаграждение за привлечение коллег (реферальная программа);&lt;/li&gt; &lt;li&gt;&lt;strong&gt;онбординг, рост и развитие:&lt;/strong&gt; система наставничества, адаптация новичков и обучение за счёт компании;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;социальные льготы и компенсации:&lt;/strong&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;компенсация питания и проезда (для офисных сотрудников);&lt;/p&gt; &lt;p&gt;частичная компенсация занятий спортом;&lt;/p&gt; &lt;p&gt;социальные выплаты по особым случаям (рождение ребёнка, свадьба и др.);&lt;/p&gt; &lt;p&gt;дополнительные оплачиваемые выходные дни;&lt;/p&gt; &lt;p&gt;оплата психологических консультаций.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;медицинское обеспечение:&lt;/strong&gt; ДМС со стоматологией предоставляется после успешного прохождения испытательного срока;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;яркая жизнь в команде:&lt;/strong&gt; праздники, спорт, тимбилдинг и настольные игры прямо в офисе.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Обязанности:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;проектирование архитектуры сервисов,&lt;strong&gt; &lt;/strong&gt;декомпозиция сложных бизнес-сценариев в набор независимых компонентов;&lt;/li&gt; &lt;li&gt;техническое лидерство в рамках фич длительностью от квартала: от сбора требований до мониторинга в production;&lt;/li&gt; &lt;li&gt;обеспечение высокого качества кода, тестирования и безопасности в зоне ответственности команды;&lt;/li&gt; &lt;li&gt;оптимизация производительности и масштабирования высоконагруженных компонентов (работа с большими объёмами данных, очередями);&lt;/li&gt; &lt;li&gt;выявление и устранение корневых причин инцидентов, внедрение практик observability (OpenTelemetry, метрики, трейсинг);&lt;/li&gt; &lt;li&gt;менторство middle-разработчиков, проведение Code Review с акцентом на архитектурные решения;&lt;/li&gt; &lt;li&gt;взаимодействие с product-менеджерами и смежными командами для формирования технического бэклога.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Требования:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;высшее образование (техническое);&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;общий опыт продуктовой backend-разработки от 6 лет, из них, не менее 2 лет коммерческой разработки на Rust;&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;опыт разработки для embedded устройств;&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;опыт проектирования и вывода в production высоконагруженных систем (RPS &amp;gt; 1000, работа с большими объёмами данных);&lt;/li&gt; &lt;li&gt;глубокое понимание async модели Rust, опыт с фреймворками tokio, axum, sqlx (или аналогичными);&lt;/li&gt; &lt;li&gt;умение проектировать отказоустойчивые, наблюдаемые и безопасные распределённые системы;&lt;/li&gt; &lt;li&gt;практический опыт с Docker/Kubernetes (включая деплоймент-стратегии, мониторинг, логирование);&lt;/li&gt; &lt;li&gt;опыт работы с несколькими типами БД (реляционные, колоночные, key-value) и понимание их применимости в разных сценариях;&lt;/li&gt; &lt;li&gt;опыт в роли фича-лида или техлида – способность вести проект от идеи до эксплуатации, координировать работу нескольких разработчиков;&lt;/li&gt; &lt;li&gt;навыки системного анализа и решения проблем в условиях неопределённости.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Будет преимуществом:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;опыт разработки на Python (FastAPI, SQLAlchemy);&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;знакомство с RabbitMQ, ClickHouse, OpenTelemetry;&lt;/li&gt; &lt;li&gt;опыт работы с видео/аудио потоками или ML-сервисами (особенно Computer Vision);&lt;/li&gt; &lt;li&gt;опыт работы с видеопотоками, знание протоколов RTSP, WebRTC;&lt;/li&gt; &lt;li&gt;опыт микросервисной разработки.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Мы рады, что вы внимательно изучили нашу вакансию и просим начать наше знакомство с сопроводительного письма &amp;quot;Мне интересна вакансия &amp;quot;Фалькон Тех&amp;quot; потому
